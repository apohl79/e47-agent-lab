<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Inline Discussion</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill-rule='evenodd' d='M16 3C8.82 3 3 8.37 3 15c0 3.5 1.7 6.65 4.43 8.77L6.2 29l6.48-2.88c1.06.3 2.18.46 3.32.46 7.18 0 13-5.19 13-11.58S23.18 3 16 3Zm-6 10a2 2 0 1 0 0 4 2 2 0 0 0 0-4Zm6 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4Zm6 0a2 2 0 1 0 0 4 2 2 0 0 0 0-4Z'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<header id="topbar">
  <div id="title">Inline Discussion</div>
  <div id="controls">
    <div id="inference-defaults" hidden></div>
    <button id="back-to-discussion" class="btn" hidden>Back to discussion</button>
    <button id="theme-toggle" aria-label="Toggle theme">☾</button>
    <button id="width-toggle" aria-label="Toggle width">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 5h10M5 10h10M5 15h10" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg>
      <span>Comfortable</span>
    </button>
    <button id="apply-top" class="btn apply-btn" disabled title="Nothing to apply yet.">Apply<span class="apply-count" hidden></span></button>
    <button id="pause-top" class="btn">Pause</button>
    <button id="finish-top" class="btn">Finish discussion</button>
  </div>
</header>
<main id="doc"></main>
<footer id="bottombar">
  <div id="stats"></div>
  <div id="bottom-controls">
    <button id="apply-bottom" class="btn apply-btn" disabled title="Nothing to apply yet.">Apply<span class="apply-count" hidden></span></button>
    <button id="pause-bottom" class="btn">Pause</button>
    <button id="finish-bottom" class="btn">Finish discussion</button>
  </div>
</footer>
<script type="module" src="/app.js"></script>
</body>
</html>
